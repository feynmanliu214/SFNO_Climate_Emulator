# SFNO training configuration.
#
# A config file holds one or more named blocks; select one at launch with
# --config-name. Point the data and statistics keys at your own packaged
# dataset, then tune the architecture and optimization sections for your grid,
# channel set, and compute budget.
#
# Full key reference: makani/config/README.md and the base configs in
# makani/config/.

example_sfno: &EXAMPLE_SFNO

    # ---- data ------------------------------------------------------------
    # Makani expects HDF5 shards plus a metadata JSON describing the channels.
    metadata_json_path: "/path/to/dataset/metadata/data.json"
    train_data_path:    "/path/to/dataset/train"
    valid_data_path:    "/path/to/dataset/valid"
    exp_dir:            "/path/to/runs"

    n_years: 1
    img_shape_x: 64          # match your dataset grid
    img_shape_y: 128

    # ---- normalization statistics ---------------------------------------
    # Generated from your training split.
    min_path:             "/path/to/stats/mins.npy"
    max_path:             "/path/to/stats/maxs.npy"
    time_means_path:      "/path/to/stats/time_means.npy"
    global_means_path:    "/path/to/stats/global_means.npy"
    global_stds_path:     "/path/to/stats/global_stds.npy"
    time_diff_means_path: "/path/to/stats/time_diff_means.npy"
    time_diff_stds_path:  "/path/to/stats/time_diff_stds.npy"

    # ---- architecture ----------------------------------------------------
    nettype: "SFNO"
    model_grid_type: "equiangular"
    sht_grid_type: "legendre-gauss"
    filter_type: "linear"
    operator_type: "dhconv"
    scale_factor: 2
    embed_dim: 256
    num_layers: 8
    normalization_layer: "instance_norm"
    hard_thresholding_fraction: 1.0
    activation_function: "gelu"
    complex_activation: "real"
    use_mlp: !!bool True
    mlp_mode: "serial"
    mlp_ratio: 2
    separable: !!bool False
    pos_embed: "none"

    # ---- loss ------------------------------------------------------------
    losses:
    -   type: "l2"
        channel_weights: "auto"
        temp_diff_normalization: !!bool True
        parameters:
            squared: !!bool True

    # ---- optimization ----------------------------------------------------
    optimizer_type: "Adam"
    lr: 1E-3
    weight_decay: 0.0
    batch_size: 16
    max_epochs: 100

    scheduler: "CosineAnnealingLR"
    scheduler_T_max: 100
    scheduler_min_lr: 0.0
    lr_warmup_steps: 0

    # ---- evaluation ------------------------------------------------------
    n_eval_samples: 256
    valid_autoreg_steps: 1

    # ---- dataloader ------------------------------------------------------
    num_data_workers: 4
    dt: 1
    n_history: 0

    # ---- logging ---------------------------------------------------------
    log_to_screen: !!bool True
    log_to_wandb: !!bool False
    save_checkpoint: !!bool True
    verbose: !!bool False
